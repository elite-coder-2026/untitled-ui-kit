<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatars - Untitled UI Kit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/css/app.css">
</head>
<body class="avatars-page">

  <section>
    <h2>Sizes</h2>

      <ui-avatar name="Olivia Rhye" src="../src/img/avatars/avatar-01.png" size="xs"></ui-avatar>
      <ui-avatar name="Phoenix Baker" src="../src/img/avatars/avatar-02.png" size="sm"></ui-avatar>
      <ui-avatar name="Lana Steiner" src="../src/img/avatars/avatar-03.png" size="md"></ui-avatar>
      <ui-avatar name="Demi Wilkinson" src="../src/img/avatars/avatar-04.png" size="lg"></ui-avatar>
      <ui-avatar name="Candice Wu" src="../src/img/avatars/avatar-05.png" size="xl"></ui-avatar>
      <ui-avatar name="Natali Craig" src="../src/img/avatars/avatar-06.png" size="2xl"></ui-avatar>
    </div>
  </section>

  <section>
    <h2>All Avatars</h2>
    <div class="avatar-row">
      <ui-avatar name="Olivia Rhye" src="../src/img/avatars/avatar-01.png" size="lg"></ui-avatar>
      <ui-avatar name="Phoenix Baker" src="../src/img/avatars/avatar-02.png" size="lg"></ui-avatar>
      <ui-avatar name="Lana Steiner" src="../src/img/avatars/avatar-03.png" size="lg"></ui-avatar>
      <ui-avatar name="Demi Wilkinson" src="../src/img/avatars/avatar-04.png" size="lg"></ui-avatar>
      <ui-avatar name="Candice Wu" src="../src/img/avatars/avatar-05.png" size="lg"></ui-avatar>
      <ui-avatar name="Natali Craig" src="../src/img/avatars/avatar-06.png" size="lg"></ui-avatar>
      <ui-avatar name="Drew Cano" src="../src/img/avatars/avatar-07.png" size="lg"></ui-avatar>
      <ui-avatar name="Orlando Diggs" src="../src/img/avatars/avatar-08.png" size="lg"></ui-avatar>
      <ui-avatar name="Andi Lane" src="../src/img/avatars/avatar-09.png" size="lg"></ui-avatar>
      <ui-avatar name="Kate Morrison" src="../src/img/avatars/avatar-10.png" size="lg"></ui-avatar>
    </div>
  </section>

  <script src="../src/js/components.js"></script>

</html>
