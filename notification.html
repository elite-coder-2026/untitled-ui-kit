    <div class="notify">
        <div class="profile">
            <img src="img/notify/Avatar.svg" alt="notify-avatar">

        <div class="content">

            <div class="content-body">
                <p class="message">
                    I’ve finished adding my notes. Happy for

                </p>
                <div class="action-links">
                    <a href="#" id="dismiss" class="secondary-link">dismiss</a>
                    <a href="e" id="reply" class="primary-link">reply</a>
                </div>
            </div>
        </div>
        <div class="icon">
            <div class="sm-close-icon"></div>
        </div>
    </div>
