  <!-- With Section Labels & No Icons -->
  <section>
    <h2>With Section Labels</h2>
    <div class="dropdown-grid">
      <div class="dropdown">
        <button class="dropdown-trigger" aria-haspopup="true" aria-expanded="false">
          Account menu
          <svg class="chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div class="dropdown-menu" role="menu">
          <div class="dropdown-items">
            <div class="dropdown-label">Account</div>
            <button class="dropdown-item" role="menuitem">
              Profile
              <span class="dropdown-shortcut">⌘P</span>
            </button>
            <button class="dropdown-item" role="menuitem">
              Settings
              <span class="dropdown-shortcut">⌘S</span>
            </button>
            <button class="dropdown-item" role="menuitem">

            </button>
            <div class="dropdown-divider"></div>

            </button>

              Create team

            </button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item" role="menuitem">
              Log out
              <span class="dropdown-shortcut">⌥⇧Q</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Dropdown with Checkboxes -->

    <h2>With Checkboxes</h2>
    <div class="dropdown-grid">
      <div class="dropdown">
        <button class="dropdown-trigger" aria-haspopup="true" aria-expanded="false">
          Select columns
          <svg class="chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div class="dropdown-menu" role="menu">
          <div class="dropdown-items">
            <label class="dropdown-check">
              <input type="checkbox" checked>
              Name
            </label>
            <label class="dropdown-check">
              <input type="checkbox" checked>
              Email
            </label>
            <label class="dropdown-check">

            </label>
            <label class="dropdown-check">

            </label>
            <label class="dropdown-check">
              <input type="checkbox">

            </label>
